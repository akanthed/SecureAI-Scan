name: Dependency Audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm run check:runtime
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high