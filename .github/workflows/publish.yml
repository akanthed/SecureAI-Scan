name: Publish to npm

# Requires an NPM_TOKEN secret configured in the repo settings
# (Settings -> Secrets and variables -> Actions) before this will actually
# publish. Documented in PUBLISHING.md, which previously described this
# workflow but never had it committed — publishing was manual until now.

on:
  push:
    tags:
      - "v*" # Triggers on any tag like v0.2.0, v1.0.0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
