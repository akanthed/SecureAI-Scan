name: Bug report
description: Something other than a scanner finding is broken (crash, wrong CLI output, bad report format, etc.)
title: "[bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: SecureAI-Scan version
      placeholder: "0.4.1"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "20.11.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11 / macOS 15 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Full error output/stack trace if there is one.
      render: text
    validations:
      required: true
